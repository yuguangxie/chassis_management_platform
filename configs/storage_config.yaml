storage:
  # Every mutable path is derived by the backend from RuntimeConfig.data_root.
  # These names document the fixed layout; they are not independently editable.
  layout_version: 1
  database: database/chassis_eol.sqlite3
  application_logs: logs/application
  raw_can: logs/raw_can
  decoded_signals: logs/decoded_signals
  reports: reports
  exports: exports
  temporary: temp
  backups: backups
  print_jobs: print_jobs
raw_can_logging:
  enabled: true
  format: csv
  rotate_by: session_and_date
  flush_interval_ms: 1000
  compress_rotated: true
decoded_signal_logging:
  enabled: true
  format: csv
  sample_mode: change_or_periodic
  periodic_sample_ms: 100
retention:
  raw_can_days: 180
  decoded_signal_days: 180
  reports_days: 3650
  app_logs_days: 90
  unattended_cleanup: false
  require_admin_confirmation: true
integrity:
  write_file_hash: true
  report_records_log_hash: true
  backup_manifest_hash: sha256
